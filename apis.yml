name: Catalant
description: >-
  Catalant is a consulting platform that connects organizations with a global marketplace
  of experienced independent consultants and boutique firms, positioning itself as "Consulting
  2.0" fit-to-purpose consulting that is faster, more flexible, and more cost efficient than
  traditional large consulting firms. Its network spans 10,000+ vetted consultants (many from
  Fortune 500 companies and top-tier consulting firms, averaging 19+ years of experience) and
  serves 700+ businesses across 20+ countries. Catalant covers engagement areas including
  Digital & AI, Transformation & Value Creation, Operations, Sales & Marketing, M&A / Integration
  & Separation, Strategy & Finance, and Organization & People. Catalant is a General Catalyst
  portfolio company. No public developer API or documentation surface was found during enrichment;
  this profile captures the company's public web, legal, and support properties.
